<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>내 가계부</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='white'%3E₩%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#f4f5f7; --card:#fff; --text:#1c1f26; --sub:#6b7280; --line:#e5e7eb;
    --ok:#15803d; --okbg:#e8f5ec; --warn:#b45309; --warnbg:#fdf1dc; --bad:#b42318; --badbg:#fde8e6;
    --accent:#2563eb; --c1:#2563eb; --c2:#0d9488; --c4:#d97706; --inc:#15803d; --exp:#1c1f26; --c3:#7c3aed; --c5:#db2777; --c6:#64748b; --debt:#b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --card:#1a1d24; --text:#e8eaee; --sub:#9aa1ad; --line:#2a2e38;
      --ok:#4ade80; --okbg:#12301d; --warn:#fbbf24; --warnbg:#35290d; --bad:#f87171; --badbg:#3a1714;
      --accent:#6b9bff; --c1:#6b9bff; --c2:#2dd4bf; --c4:#fbbf24; --inc:#4ade80; --exp:#e8eaee; --c3:#a78bfa; --c5:#f472b6; --c6:#94a3b8; --debt:#f87171;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.5; }
  [hidden] { display:none !important; }
  #shell { max-width:720px; margin:0 auto; padding:0 14px calc(84px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 2px 10px; }
  header h1 { font-size:20px; margin:0; }
  .badge { font-size:12px; padding:3px 10px; border-radius:999px; background:var(--warnbg); color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; overflow-x:auto; }
  .card h2 { font-size:15px; margin:0 0 12px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card h2 small { font-weight:400; color:var(--sub); font-size:12px; }
  label.f { display:block; font-size:12px; color:var(--sub); margin:12px 0 4px; }
  input, select, textarea { font:inherit; font-size:16px; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:0; }
  .amt { font-size:28px; font-weight:700; text-align:right; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; font:inherit; font-size:14px; padding:10px; border:0; background:var(--bg); color:var(--sub); cursor:pointer; }
  .seg button.on { background:var(--accent); color:#fff; font-weight:600; }
  .btn { font:inherit; font-size:16px; font-weight:600; padding:12px 16px; border-radius:12px; border:0; background:var(--accent); color:#fff; cursor:pointer; width:100%; margin-top:16px; }
  .btn.sec { background:var(--bg); color:var(--text); border:1px solid var(--line); font-weight:500; }
  .btn.del { background:var(--badbg); color:var(--bad); }
  .btn.sm { width:auto; margin:0; padding:8px 14px; font-size:14px; }
  nav { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-top:1px solid var(--line); display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav .in { display:flex; width:100%; max-width:720px; }
  nav button { flex:1; font:inherit; font-size:12px; padding:10px 0 8px; border:0; background:none; color:var(--sub); cursor:pointer; }
  nav button b { display:block; font-size:20px; font-weight:400; line-height:1.2; }
  nav button.on { color:var(--accent); font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:8px 5px; border-bottom:1px solid var(--line); text-align:right; vertical-align:middle; }
  td:first-child, th:first-child { text-align:left; }
  th { color:var(--sub); font-weight:500; font-size:12px; }
  tr:last-child td { border-bottom:none; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
  .tag.ok { background:var(--okbg); color:var(--ok); } .tag.warn { background:var(--warnbg); color:var(--warn); }
  .tag.bad { background:var(--badbg); color:var(--bad); } .tag.na { background:var(--bg); color:var(--sub); }
  .banner { border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:14px; }
  .banner.warn { background:var(--warnbg); color:var(--warn); } .banner.ok { background:var(--okbg); color:var(--ok); } .banner.bad { background:var(--badbg); color:var(--bad); }
  .note { color:var(--sub); font-size:12px; margin-top:8px; }
  .pos { color:var(--inc); } .neg { color:var(--bad); }
  .item { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:last-child { border-bottom:none; }
  .item .l { min-width:0; } .item .t { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .s { font-size:12px; color:var(--sub); } .item .a { font-weight:600; white-space:nowrap; text-align:right; }
  .item.ex { opacity:.55; }
  .dayh { font-size:12px; color:var(--sub); padding:12px 0 2px; display:flex; justify-content:space-between; }
  .meter { margin:12px 0; font-size:14px; } .meter .top { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .prog { height:8px; background:var(--bg); border-radius:4px; overflow:hidden; margin-top:4px; }
  .prog span { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .prog span.mid { background:var(--warn); } .prog span.over { background:var(--bad); }
  .hbar { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:13px; }
  .hbar .lbl { width:84px; flex:none; } .hbar .track { flex:1; height:14px; background:var(--bg); border-radius:4px; overflow:hidden; }
  .hbar .track span { display:block; height:100%; background:var(--c1); } .hbar .val { width:118px; text-align:right; flex:none; font-size:12px; }
  .lg { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--sub); margin-top:6px; }
  .lg i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  svg text { fill:var(--sub); font-size:11px; }
  .big { font-size:30px; font-weight:700; }
  .sum { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; font-size:13px; color:var(--sub); }
  .sum b { display:block; font-size:17px; color:var(--text); }
  #login { max-width:380px; margin:12vh auto 0; padding:0 18px; }
  #login .card { padding:24px; }
  #login h1 { margin:0 0 4px; font-size:22px; }
  .err { color:var(--bad); font-size:13px; margin-top:10px; min-height:18px; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  #modal .sheet { background:var(--card); width:100%; max-width:720px; max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); }
  #toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); background:#1c1f26; color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:.95; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px) { .two { grid-template-columns:1fr; } } .hero .row { display:flex; gap:20px; flex-wrap:wrap; margin-top:8px; } .hero .row div { font-size:13px; color:var(--sub); } .hero .row b { display:block; font-size:17px; color:var(--text); } .stack { display:flex; height:22px; border-radius:6px; overflow:hidden; margin:6px 0 10px; background:var(--bg); } .stack span { display:block; height:100%; } .legend { display:inline-flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; } .steps { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; } .step { border:1px solid var(--line); border-radius:10px; padding:10px; font-size:12px; } .step.cur { border:2px solid var(--accent); } .step .n { font-size:18px; font-weight:700; } .step .p { color:var(--sub); } .cond { font-size:13px; margin:12px 0 0; } @media (max-width:640px) { .steps { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h1>내 가계부</h1>
    <div class="note" style="margin:0 0 14px">로그인이 필요합니다.</div>
    <form id="loginForm">
      <label class="f">이메일</label><input id="lEmail" type="email" autocomplete="username" required>
      <label class="f">비밀번호</label><input id="lPw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">로그인</button>
      <div class="err" id="lErr"></div>
    </form>
  </div>
</div>

<div id="shell" hidden>
  <header><h1>내 가계부</h1><span class="badge" id="modeBadge" hidden>미리보기 · 저장 안 됨</span></header>
  <main id="view"></main>
  <nav><div class="in" id="nav">
    <button data-tab="input"><b>＋</b>입력</button>
    <button data-tab="history"><b>☰</b>내역</button>
    <button data-tab="analysis"><b>▥</b>분석</button>
    <button data-tab="asset"><b>◎</b>자산</button><button data-tab="settings"><b>⚙</b>설정</button>
  </div></nav>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
